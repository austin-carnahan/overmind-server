# cerebrate-supervisor profiles file: deployed as
# /data/local/tmp/cerebrate-profiles.conf (STAGING_DIR) and read once at
# supervisor startup (cerebrate-supervisor.cc). Deployment-owned, like the
# worker configs it names; a client still only picks a profile by name.
#
#   slot <name> <port> <binary> [ready_timeout_ms]
#   profile <name> <slot> <declared model file> <worker config> [min_free_mb]
#
# One slot per model (one model per process); ports 8774-8782 skip 8777, the
# side-by-side test supervisor's control port. min_free_mb is an admission
# floor: the measured free-memory drop of the profile (load + its validation
# requests, 2026-10-25) plus 1 GB of headroom, so a start never takes the
# phone below ~1 GB (the low-memory killer's reach toward the Debian VM).
# Registry: models/variants.yaml (serving.slot / serving.profile).

slot gpu-depth    8774 cerebrate-hetero
slot gpu-migan    8775 cerebrate-hetero
slot gpu-dinov2   8776 cerebrate-hetero
slot gpu-yoloe11s 8778 cerebrate-hetero
slot gpu-sam2     8779 cerebrate-hetero
slot gpu-rfdetr   8780 cerebrate-hetero
slot gpu-esam3    8781 cerebrate-hetero
slot gpu-owlv2    8782 cerebrate-hetero

# Depth Anything V2 Small: drop 300 MB (fp32) / 221 MB (fast)
profile depth-anything-v2-small-fast    gpu-depth    depth_anything_v2_small.tflite        depth-anything-v2-small-fast.conf    1300
profile depth-anything-v2-small-default gpu-depth    depth_anything_v2_small.tflite        depth-anything-v2-small-default.conf 1300
# MI-GAN 512: drop 234 MB (fp32) / 125 MB (fp16)
profile mi-gan-512-fast                 gpu-migan    migan_fp16.tflite                     mi-gan-512-fast.conf                 1200
profile mi-gan-512-default              gpu-migan    migan_fp16.tflite                     mi-gan-512-default.conf              1300
# DINOv2-S/14: drop 150 MB
profile dinov2-s14-default              gpu-dinov2   dinov2_s_erf_fp16.tflite              dinov2-s14-default.conf              1200
# YOLOE-11s prompt-free: drop 414 MB
profile yoloe-11s-pf-default            gpu-yoloe11s yoloe-11s-seg-pf-fp32.tflite          yoloe-11s-pf-default.conf            1500
# SAM 2.1 Hiera-Tiny: drop 919 MB (fp32) / 568 MB (fast)
profile sam2.1-hiera-tiny-default       gpu-sam2     sam21t-encoder-prepared-fp32.tflite   sam2.1-hiera-tiny-default.conf       2000
profile sam2.1-hiera-tiny-fast          gpu-sam2     sam21t-encoder-prepared-fp32.tflite   sam2.1-hiera-tiny-fast.conf          1600
# RF-DETR-Seg-Nano: drop 279 MB (fp32) / 180 MB (fast)
profile rf-detr-seg-nano-fast           gpu-rfdetr   rfdetrseg_graphA_fp16.tflite          rf-detr-seg-nano-fast.conf           1200
profile rf-detr-seg-nano-default        gpu-rfdetr   rfdetrseg_graphA_fp16.tflite          rf-detr-seg-nano-default.conf        1300
# EfficientSAM3 RV-M (fast only; the fp32 default needs > 2.5 GB at load): drop 2,365 MB
profile efficientsam3-rvm-fast          gpu-esam3    esam3-rvm-vision-trunk-fp32.tflite    efficientsam3-rvm-fast.conf          3400
# OWLv2 B/16: drop 1,924 MB
profile owlv2-b16-default               gpu-owlv2    owlv2-b16-image-tower-fp32.tflite     owlv2-b16-default.conf               3000
