# SAM 2.1 Hiera-Tiny box refinement, configuration gpu-fp32 (model alias default;
# models/variants.yaml). Our prepared encoder (image phase, cached per
# image_id) + the GPU-clean box decoder with its three large constants fed as
# inputs (prompt phase, once per box). Photos arrive as uint8 NHWC (PIL bilinear
# 1024x1024 in the adapter), normalized here as the reference: (x / 255 - mean)
# / std. Each box arrives as its sparse prompt embedding [1,3,256] (SAM 2.1's
# prompt encoder runs in the adapter): sparse [N,1,3,256] -> masks
# [N,1,3,256,256] (logits, 3 candidates) and iou [N,1,3].
input=pixel_values
input_uint8=unit_mean_std:0.485,0.456,0.406:0.229,0.224,0.225
input_layout=nchw
graph.encoder.model=/data/local/tmp/sam21t-encoder-prepared-fp32.tflite
graph.encoder.precision=fp32
graph.encoder.inputs=pixel_values=input
graph.encoder.outputs=feat_s0,feat_s1,image_embeddings
graph.decoder.model=/data/local/tmp/sam21t-box-decoder-constin-fp32.tflite
graph.decoder.phase=prompt
graph.decoder.precision=fp32
graph.decoder.inputs=image_embeddings=encoder.image_embeddings,sparse=request:sparse,feat_s1=encoder.feat_s1,feat_s0=encoder.feat_s0,dense=file:/data/local/tmp/sam21t-dec-dense.bin,image_pe=file:/data/local/tmp/sam21t-dec-image_pe.bin,output_tokens=file:/data/local/tmp/sam21t-dec-output_tokens.bin
graph.decoder.outputs=masks,iou
prompt_outputs=decoder.masks,decoder.iou
cache_entries=2
