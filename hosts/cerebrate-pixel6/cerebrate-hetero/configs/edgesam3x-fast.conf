# EdgeSAM-3x box refinement (lane Step 4's task default): configuration
# tpu-fp16r-gpu-neck-fp32 + the GPU fp32 box decoder; fallback = the exact
# GPU fp32 encoder (configuration gpu-fp32). Artifacts from spikes/edgesam-tpu:
#   edgesam3x-enc-tpu-fp32.tflite  T1 fragment (trunk + fuse, tanh GELU)
#   edgesam3x-enc-neck-gpu.tflite  N1 fragment (neck)
#   edgesam3x-enc-gpu.tflite       F4 fragment (whole encoder, near-exact GELU)
#   edgesam3x-box-decoder.tflite   edgesam3x-box-decoder-boxin-constin-fp32.tflite
#   edgesam3x-dec-*.bin            its constant inputs (edgesam_decoder.py)
# Requests: image [1,1024,1024,3] (ResizeLongestSide + normalize + pad, NHWC),
# image_id (int64), boxes [N,1,4] xyxy in that 1024 frame -> mask_logits
# [N,1,256,256] (upscale with the original postprocess_masks) and iou [N,1,1].
# Paths are the flat staging layout cerebrate-supervisor approves (the tests
# ran the same files from /data/local/tmp/edgesam/worker/).
input=image
outputs=image_embeddings
tflite_lib=/data/local/tmp/libtensorflowlite_jni.so
tpu=/data/local/tmp/edgesam3x-enc-tpu-fp32.tflite
nnapi_cache_dir=/data/local/tmp/nnapi-cache
stage2=/data/local/tmp/edgesam3x-enc-neck-gpu.tflite
stage2_precision=fp32
fallback=/data/local/tmp/edgesam3x-enc-gpu.tflite
fallback_precision=fp32
prompt_model=/data/local/tmp/edgesam3x-box-decoder.tflite
prompt_precision=fp32
prompt_inputs=embedding=pipeline:image_embeddings,box=request:boxes,dense=file:/data/local/tmp/edgesam3x-dec-dense.bin,image_pe=file:/data/local/tmp/edgesam3x-dec-image_pe.bin,output_tokens=file:/data/local/tmp/edgesam3x-dec-output_tokens.bin,gauss=file:/data/local/tmp/edgesam3x-dec-gauss.bin,corner_embed=file:/data/local/tmp/edgesam3x-dec-corner_embed.bin
prompt_outputs=mask_logits,iou
cache_entries=4
# tpu_lock=/data/local/tmp/cerebrate-tpu.lock   # measured: no benefit (see README)
