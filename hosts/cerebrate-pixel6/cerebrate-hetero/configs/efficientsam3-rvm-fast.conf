# EfficientSAM3 RV-M text-prompted segmentation, configuration
# gpu-trunk-fp32-neck-fp16acc32-grounding-fp16acc32 (model alias fast; models/variants.yaml).
# Image phase: vision (pixels -> FPN levels 288/144/72 x 256), cached per
# image_id (one image: 111 MB of features). Prompt phase, once per phrase: the
# text encoder on the CPU (token ids [1,16] int32 -> features [16,1,256]), then
# grounding on the GPU with the five host constants fed as inputs -> logits
# [1,200,1], boxes [1,200,4], presence [1,1], masks [1,200,288,288]. Photos
# arrive as uint8 NHWC (torchvision Resize(1008) in the adapter), normalized
# here as Sam3Processor: (x * (1 / 255) - 0.5) / 0.5 (torchvision multiplies by the reciprocal).
input=pixel_values
input_uint8=recip_mean_std:0.5,0.5,0.5:0.5,0.5,0.5
input_layout=nchw
graph.trunk.model=/data/local/tmp/esam3-rvm-vision-trunk-fp32.tflite
graph.trunk.precision=fp32
graph.trunk.inputs=pixel_values=input
graph.trunk.outputs=x72
graph.vision.model=/data/local/tmp/esam3-rvm-vision-neck-fp32.tflite
graph.vision.precision=fp16acc32
graph.vision.inputs=x72=trunk.x72
graph.vision.outputs=f0,f1,f2
graph.text.model=/data/local/tmp/esam3-rvm-text-fp32.tflite
graph.text.accelerator=cpu
graph.text.phase=prompt
graph.text.inputs=ids=request:ids
graph.text.outputs=features
graph.grounding.model=/data/local/tmp/esam3-rvm-grounding-prepared-fp32.tflite
graph.grounding.phase=prompt
graph.grounding.precision=fp16acc32
graph.grounding.inputs=f0=vision.f0,f1=vision.f1,f2=vision.f2,pos=file:/data/local/tmp/esam3-const-pos.bin,text=text.features,pad=request:pad,refboxes=file:/data/local/tmp/esam3-const-refboxes.bin,geo=file:/data/local/tmp/esam3-const-geo.bin,queries=file:/data/local/tmp/esam3-const-queries.bin,presence_token=file:/data/local/tmp/esam3-const-presence.bin
graph.grounding.outputs=logits,boxes,presence,masks
prompt_outputs=grounding.logits,grounding.boxes,grounding.presence,grounding.masks
cache_entries=1
