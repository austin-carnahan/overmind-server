# YOLOE-11s prompt-free, configuration gpu-fp32 (model alias default; the
# non-preferred alternative to YOLOE-v8s). One graph, NCHW input [1,3,640,640]
# -> boxes, score, cls, coef, protos (YOLOE-v8s's contract). Photos arrive as
# uint8 NHWC, letterboxed by the adapter (same as YOLOE-v8s); x / 255 here.
input=images
input_uint8=divide:255
input_layout=nchw
graph.yoloe.model=/data/local/tmp/yoloe-11s-seg-pf-fp32.tflite
graph.yoloe.precision=fp32
graph.yoloe.inputs=images=input
graph.yoloe.outputs=boxes,score,cls,coef,protos
outputs=yoloe.boxes,yoloe.score,yoloe.cls,yoloe.coef,yoloe.protos
