# YOLOE-v8s prompt-free, configuration "fast" (TPU fp16-relaxed backbone ->
# GPU fp16acc32 head, GPU-only mixed fallback) -- the supervisor's
# yoloe-v8s-fast profile as a config file, plus NNAPI compilation caching.
input=images
outputs=boxes,score,cls,coef,protos
tflite_lib=/data/local/tmp/libtensorflowlite_jni.so
tpu=/data/local/tmp/yoloe-v8s-pf-backbone-tpu-fp32.tflite
nnapi_cache_dir=/data/local/tmp/nnapi-cache
stage2=/data/local/tmp/yoloe-v8s-pf-head-gpu.tflite
stage2_precision=fp16acc32
fallback=/data/local/tmp/yoloe-v8s-pf-gpu-nhwc.tflite
fallback_precision=fp16acc32
