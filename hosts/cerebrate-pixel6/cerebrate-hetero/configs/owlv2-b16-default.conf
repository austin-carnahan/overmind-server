# OWLv2 B/16 ensemble open-vocabulary detection, configuration gpu-fp32 (model
# alias default; models/variants.yaml). Two independent graphs: the image tower
# (image phase; pixel_values [1,3,960,960] float32, preprocessed by the MLServer
# adapter, plus the position table as a constant input) -> per patch box logits,
# objectness, class embeddings, logit shift and scale; and the text tower
# (prompt phase, GPU with CPU fallback for its int ops; token ids [32,16] int32
# per prompt -> embeddings [32,512]). The adapter calls each and computes
# logits, boxes (bias added on the host) and detections itself.
input=pixel_values
graph.image.model=/data/local/tmp/owlv2-b16-image-tower-fp32.tflite
graph.image.precision=fp32
graph.image.inputs=pixel_values=input,pos=file:/data/local/tmp/owlv2-const-pos.bin
graph.image.outputs=box_logits,objectness,class_embeds,logit_shift,logit_scale
outputs=image.box_logits,image.objectness,image.class_embeds,image.logit_shift,image.logit_scale
graph.text.model=/data/local/tmp/owlv2-b16-text-tower-fp32.tflite
graph.text.accelerator=gpu+cpu
graph.text.precision=fp32
graph.text.phase=prompt
graph.text.inputs=ids=request:ids
graph.text.outputs=embeddings
prompt_outputs=text.embeddings
