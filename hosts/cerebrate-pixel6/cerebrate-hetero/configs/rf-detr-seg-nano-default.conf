# RF-DETR-Seg-Nano, configuration gpu-fp32 (model alias default; models/variants.yaml).
# litert-community's published two-graph conversion (FP16 weights). The host
# step between the graphs (top-100 proposals) runs in the MLServer adapter, so
# a request is two calls: (1) the photo -> graph A's enc_cls, delta, memory2;
# (2) the host step's memory and refpoints as one "prompt" -> graph B's boxes,
# logits, masks. Photos arrive as uint8 NHWC (PIL bilinear 312x312 in the
# adapter), normalized here as the reference: (x / 255 - mean) / std.
input=pixel_values
input_uint8=unit_mean_std:0.485,0.456,0.406:0.229,0.224,0.225
input_layout=nchw
graph.a.model=/data/local/tmp/rfdetrseg_graphA_fp16.tflite
graph.a.precision=fp32
graph.a.inputs=image=input,clspos=file:/data/local/tmp/rfdetr-clspos.bin,pospatch=file:/data/local/tmp/rfdetr-pospatch.bin
graph.a.outputs=enc_cls,delta,memory2
outputs=a.enc_cls,a.delta,a.memory2
graph.b.model=/data/local/tmp/rfdetrseg_graphB_fp16.tflite
graph.b.phase=prompt
graph.b.precision=fp32
graph.b.inputs=memory=request:memory,refpoints=request:refpoints,query_feat=file:/data/local/tmp/rfdetr-query_feat.bin
graph.b.outputs=boxes,logits,masks
prompt_outputs=b.boxes,b.logits,b.masks
