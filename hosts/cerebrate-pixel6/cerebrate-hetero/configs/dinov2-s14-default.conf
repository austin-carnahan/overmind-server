# DINOv2 ViT-S/14, configuration gpu-fp32 (model alias default; models/variants.yaml).
# litert-community's published exact-GELU file (FP16 weights) at FP32 compute:
# pixel_values [1,3,448,448] NCHW -> final-normalized patch tokens [1,1024,384].
# Photos arrive as uint8 NHWC (PIL bicubic 448x448 in the adapter), normalized
# here as the reference: (x / 255 - mean) / std in float32.
input=pixel_values
input_uint8=unit_mean_std:0.485,0.456,0.406:0.229,0.224,0.225
input_layout=nchw
graph.dino.model=/data/local/tmp/dinov2_s_erf_fp16.tflite
graph.dino.precision=fp32
graph.dino.inputs=pixel_values=input
graph.dino.outputs=patch_tokens
outputs=dino.patch_tokens
