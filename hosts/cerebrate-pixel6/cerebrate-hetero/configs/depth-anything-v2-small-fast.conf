# Depth Anything V2 Small, configuration gpu-fp16acc32 (model alias fast; models/variants.yaml).
# litert-community's published FP32 file, one graph: pixel_values [1,3,518,686]
# NCHW -> relative depth [1,518,686]. Photos arrive as uint8 NHWC (stretched to
# 686x518 with PIL bicubic by the MLServer adapter) and are normalized here as
# the reference does it in numpy: (x / 255 - mean) / std, in float32.
input=pixel_values
input_uint8=unit_mean_std:0.485,0.456,0.406:0.229,0.224,0.225
input_layout=nchw
graph.depth.model=/data/local/tmp/depth_anything_v2_small.tflite
graph.depth.precision=fp16acc32
graph.depth.inputs=pixel_values=input
graph.depth.outputs=depth
outputs=depth.depth
