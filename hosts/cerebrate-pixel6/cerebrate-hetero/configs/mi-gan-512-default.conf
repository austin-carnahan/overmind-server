# MI-GAN 512 Places2, configuration gpu-fp32 (model alias default; models/variants.yaml).
# litert-community's published file (FP16 weights), one graph: the generator
# input concat(keep - 0.5, rgb * keep) [1,4,512,512] float32, built by the
# MLServer adapter as the author's pipeline does -> image [1,3,512,512] in [-1, 1].
input=masked_image
graph.migan.model=/data/local/tmp/migan_fp16.tflite
graph.migan.precision=fp32
graph.migan.inputs=x=input
graph.migan.outputs=image
outputs=migan.image
