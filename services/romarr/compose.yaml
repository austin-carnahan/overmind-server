services:
  romarr:
    # v0.8.0 has a confirmed bug: its Transmission download-client class is
    # missing a `name` attribute, crashing with
    # "AttributeError: 'Transmission' object has no attribute 'name'" the
    # moment it tries to grab anything. Fixed in commit 8c94adb ("Repair
    # torrents qBittorrent emptied, and stop importing them"), not yet in a
    # numbered release — pinned to that exact commit's published image
    # instead of 0.8.0 or a floating `latest`. Confirmed linux/amd64+arm64+arm.
    image: ghcr.io/blizzhacker/romarr:sha-8c94adb@sha256:13c5214c7ae7f5c4ef6bc49810351e7ed7f927f93a4648be2fadc9b2eb98a9e7
    container_name: romarr
    env_file:
      - ./.env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: "Etc/UTC"
      # LIBRARY_KIND defaults to "romm" — must be set explicitly or ROMarr
      # expects a RomM connection we don't have.
      LIBRARY_KIND: ${LIBRARY_KIND}
      LIBRARY_PATH: ${LIBRARY_PATH}
      PROWLARR_URL: ${PROWLARR_URL}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      DAT_PATH: ${DAT_PATH}
    ports:
      - "6868:6868" # WebUI, reachable only over Tailscale (no router port-forward)
    volumes:
      - ${ROMARR_CONFIG_ROOT}:/config
      - ${ROMARR_STAGING_ROOT}:/roms
      - ${ROMARR_DATS_ROOT}:/dats
      # Read-write: ROMarr imports finished downloads out of here. Same host
      # path Transmission writes to, same container path (/downloads) as
      # Radarr/Sonarr use, so ROMarr's download-client integration finds
      # completed files without a remote path mapping.
      - ${TRANSMISSION_DOWNLOAD_ROOT}:/downloads
    restart: unless-stopped
