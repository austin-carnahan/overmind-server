services:
  flaresolverr:
    # Verified: flaresolverr/flaresolverr publishes linux/arm64. Pin an exact
    # tag before real deployment; this is an example, not a version selection.
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # Docker's default 64MB /dev/shm is a common cause of a real headless
    # Chromium hanging/crashing during page render rather than erroring
    # cleanly — general Docker+Chromium guidance, not FlareSolverr-specific
    # documentation. Worth trying given consistent 60s timeouts; not a
    # confirmed fix.
    shm_size: "2gb"
    env_file:
      - ./.env
    environment:
      TZ: "Etc/UTC"
    ports:
      - "8191:8191" # Reachable only over Tailscale; also reachable by other
                     # containers on the shared network as http://flaresolverr:8191
    restart: unless-stopped
