services:
  transmission:
    # Verify and pin an exact current tag before real deployment; this is an
    # example, not a version selection.
    image: linuxserver/transmission:latest
    container_name: transmission
    # No network of its own: every packet routes through the gluetun
    # container's PIA tunnel (see services/pia/compose.yaml), so Transmission
    # cannot leak traffic outside it even if misconfigured.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      # Transmission's whole state: settings.json, resume files, queue, DHT.
      # A directory, never a single-file mount: Transmission saves by writing
      # settings.json.tmp.* and renaming it over settings.json, and Docker
      # refuses that rename on a file bind mount, so settings changed at run
      # time were silently lost on every restart (until 2026-10-28). Seed
      # settings.json from settings.example.json before first run.
      - ${TRANSMISSION_CONFIG_ROOT}:/config
      - ${TRANSMISSION_DOWNLOAD_ROOT}:/downloads
      - ${TRANSMISSION_ROMSETS_STAGING_ROOT}:/romsets-staging
    restart: unless-stopped
