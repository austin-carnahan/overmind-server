services:
  prowlarr:
    # Verify and pin an exact current tag before real deployment; this is an
    # example, not a version selection.
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    env_file:
      - ./.env
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    ports:
      - "9696:9696" # WebUI, reachable only over Tailscale (no router port-forward)
    volumes:
      - ${PROWLARR_CONFIG_ROOT}:/config
    restart: unless-stopped
