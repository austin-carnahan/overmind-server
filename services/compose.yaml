# Brings up whichever service fragments are currently selected. Comment a
# line out to remove that service from the stack; add a line when a new
# service gets a compose.yaml. No custom orchestrator beyond Compose itself —
# see design-notes/architecture.md.
#
# Usage: docker compose -f services/compose.yaml up -d
#        docker compose -f services/compose.yaml down
include:
  - path: pia/compose.yaml
  - path: transmission/compose.yaml
  - path: paperclip/compose.yaml
  # Jellyfin/Radarr/Sonarr/Bazarr are designed (see their compose.yaml and
  # README) but bind-mount /mnt/library, which doesn't exist until the SSD is
  # attached and mounted. Uncomment once that's real — bringing them up
  # before then makes Docker silently create empty directories on the
  # microSD at those paths.
  # - path: jellyfin/compose.yaml
  # - path: radarr/compose.yaml
  # - path: sonarr/compose.yaml
  # - path: bazarr/compose.yaml
