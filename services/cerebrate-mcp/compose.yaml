# Cerebrate MCP (services/cerebrate-mcp/README.md): the Pixel's inference
# endpoints for MCP clients. Loopback-only, same pattern as garmin-mcp: the
# native OpenClaw Gateway on this host connects to 127.0.0.1:8002/mcp.
# Reads the model registry and the adapter's mask codec from this checkout
# (read-only); calls MLServer through the Pixel tunnel on the host
# (127.0.0.1:8500, reached as host.docker.internal from the container).
services:
  cerebrate-mcp:
    build:
      context: .
    container_name: cerebrate-mcp
    # Runs as austin, who owns /var/lib/overmind (same as maintainerr), so the
    # artifact directory needs no root-owned setup.
    user: "1000:1000"
    mem_limit: 512m
    environment:
      CEREBRATE_MCP_MLSERVER_URL: http://host.docker.internal:8500
      CEREBRATE_MCP_REGISTRY_DIR: /repo/models
      CEREBRATE_MCP_ADAPTER_DIR: /repo/adapter
      # Same path inside and outside the container, so artifact paths in
      # results are valid for same-host clients too.
      CEREBRATE_MCP_ARTIFACT_DIR: /var/lib/overmind/cerebrate-mcp/artifacts
      CEREBRATE_MCP_ARTIFACT_TTL_H: "24"
      # Signed artifact URLs in results (README, "Artifact URLs"): served by
      # this container's /artifacts route through Caddy's artifacts.home.arpa
      # site -- the only path of this server reachable from other machines.
      # The signing key is created on first start at
      # /var/lib/overmind/cerebrate-mcp/url-key.
      CEREBRATE_MCP_PUBLIC_URL: http://artifacts.home.arpa
      # Design-studio project sources (immutable, world-readable) as image
      # inputs by path, so an agent passes a reference, not the photo's bytes.
      CEREBRATE_MCP_INPUT_ROOTS: /mnt/substrate/design-studio/projects
      CEREBRATE_MCP_HOST: "0.0.0.0"
      CEREBRATE_MCP_PORT: "8000"
    volumes:
      - ./cerebrate_mcp:/app/cerebrate_mcp:ro
      - ../../models:/repo/models:ro
      - ../../hosts/cerebrate-pixel6/mlserver/models/cerebrate-graph:/repo/adapter:ro
      # The service's state directory: artifacts/ and the URL-signing key.
      - /var/lib/overmind/cerebrate-mcp:/var/lib/overmind/cerebrate-mcp
      - /mnt/substrate/design-studio/projects:/mnt/substrate/design-studio/projects:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host port 8002: 8000 is cloudflare-solver's, 8001 garmin-mcp's.
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
