# Cerebrate Pixel 6 execution variants: how each model configuration runs.
# Keys are immutable <model>/<variant> ids named for what runs where at which
# precision (models/README.md has the conventions); roles like "fast" are
# model-level aliases in catalog.yaml, and lifecycle is `status` here:
#   validated   passed validation, no serving path
#   staged      serving path built and tested beside production, not live
#   production  live (an MLServer endpoint, or a deployed profile that a
#               production endpoint can be pointed at)
#   rejected    failed validation or not adopted -- kept so it isn't retried
# Benchmarks say what they measure (`measure`):
#   device     synchronized end to end on the phone for the graph(s) named
#              (input write through output read; litert_e2e / litert_chain)
#   worker     cerebrate-hetero's inference time (DONE inference_us)
#   round-trip from the guest through MLServer and back
#   summed     calculated from separately measured stages
#   connected  measured as one connected pipeline
# Missing measurements are null/absent, never estimated. Reports stay in the
# ledgers; `record` points at them (validated by scripts/validate-model-catalog).
schema_version: 1

variants:

  # ---- MobileNet v1 (control workload) -------------------------------------
  mobilenetv1/tpu-int8:
    status: production
    stages:
      - {name: classifier, artifact: tflite, accelerator: tpu, precision: int8, weights: int8, runtime: tflite-2.16.1-nnapi}
    validation:
      reference: deterministic i%256 input, class 795
      metrics: {top_class: 795}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-23--onnx-runtime-1300-through-cerebrate-graph
    benchmarks:
      - {measure: worker, ms: 0.9, statistic: p50, covers: "cerebrate-infer inference, alone", record: experiments/pixel6/results.md#2026-10-24--cerebrate-hetero-as-the-common-serving-worker-edgesam--yoloe}
      - {measure: round-trip, ms: 2.3, statistic: p50, covers: "direct TCP client to cerebrate-infer, alone; p99 37 ms with YOLOE + EdgeSAM running", record: experiments/pixel6/results.md#2026-10-24--cerebrate-hetero-as-the-common-serving-worker-edgesam--yoloe}
    resources: {ram_mb: null}
    serving: {slot: infer, mlserver_model: cerebrate-infer}
    notes: Served by cerebrate-infer (a direct worker slot, no profiles); predates the hetero worker.

  # ---- SmolLM2 (generation canary) -----------------------------------------
  smollm2-135m-instruct/litertlm-cpu:
    status: production
    stages:
      - {name: llm, artifact: litertlm, accelerator: cpu, precision: fp32, runtime: litert-lm}
    validation:
      reference: coherent output in the feasibility spike
      metrics: {output: coherent}
      verdict: correct
    resources: {ram_mb: null}
    serving: {slot: generate, mlserver_model: cerebrate-generate}
    notes: Served by cerebrate-generate (a direct worker slot, backend cpu).

  # ---- YOLOE-v8s prompt-free -----------------------------------------------
  yoloe-v8s-pf/tpu-fp16r-gpu-head-fp16acc32:
    status: production
    stages:
      - {name: backbone+neck, artifact: tflite_tpu_backbone, accelerator: tpu, precision: fp16-relaxed, runtime: tflite-2.16.1-nnapi, phase: image}
      - {name: head, artifact: tflite_gpu_head, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: image}
    internal_fallback: yoloe-v8s-pf/gpu-fp16acc32
    preparation:
      - "SAME max-pool padding corrected as maxpool(x + c) - c (exact; the TPU pads with 0)"
      - "head on the GPU with native int32 argmax (exact)"
    validation:
      reference: Ultralytics 8.4.184 yoloe-v8s-seg-pf (PyTorch)
      inputs: lane photos (8), 132 reference detections
      metrics: {detections_retained: "132/132", extra_detections: 0, box_iou_min: 0.965, mask_iou_mean: 0.996}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-24--yoloe-v8s-tpu--gpu-pipeline-fastest-validated-full-vocabulary-configuration
    benchmarks:
      - {measure: worker, ms: 78, statistic: p50, covers: "inference in the worker, uint8 photo input 640x640 (TPU ~13 ms + GPU)", record: experiments/pixel6/results.md#2026-10-24--combined-yoloe--edgesam-deployment-integration-tests-staged-not-live}
      - {measure: round-trip, ms: 280, statistic: p50, covers: "photo in, JSON detections out, production gRPC", record: experiments/pixel6/results.md#2026-10-25--deployed-image-transport-both-steps-and-edgesam}
    resources: {ram_mb: 713, startup_ms: 2200, thermal: "TPU <= 55 C, GPU <= 56 C over a 3-minute sustained run", notes: "startup from the NNAPI compilation cache; ~3.8 s TPU compile on an empty cache"}
    serving:
      slot: hetero1
      profile: yoloe-v8s-fast
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/yoloe-v8s-fast.conf
      mlserver_model: yoloe-v8s-pf
      runtime_files: [libtensorflowlite_jni.so]

  yoloe-v8s-pf/gpu-fp32:
    status: production
    stages:
      - {name: model, artifact: tflite_gpu_full, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
    validation:
      reference: Ultralytics 8.4.184 yoloe-v8s-seg-pf (PyTorch)
      inputs: lane photos (8), 132 reference detections
      metrics: {detections_retained: "132/132", box_iou_min: 1.0, mask_iou_min: 1.0}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop
    benchmarks:
      - {measure: device, ms: 186, statistic: median, covers: "whole model, litert_e2e", record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop}
      - {measure: worker, ms: 202, statistic: p50, covers: "inference in the worker", record: experiments/pixel6/results.md#2026-10-24--cerebrate-hetero-deployment-prepared-supervisor-slot-on-demand-mlserver-model-catalog}
    resources: {ram_mb: null}
    serving:
      slot: hetero1
      profile: yoloe-v8s-default
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/yoloe-v8s-default.conf

  yoloe-v8s-pf/gpu-fp16acc32:
    previous_ids: [gpu-mixed]
    status: production
    selectable: false
    stages:
      - {name: model, artifact: tflite_gpu_full, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: image}
    validation:
      reference: Ultralytics 8.4.184 yoloe-v8s-seg-pf (PyTorch)
      metrics: {detections_retained: "132/132", extra_detections: 1, box_iou_min: 0.965, mask_iou_mean: 0.996}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop
    benchmarks:
      - {measure: device, ms: 108, statistic: median, covers: "whole model, litert_e2e", record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop}
      - {measure: worker, ms: 107, statistic: p50, covers: "inference in the worker"}
    notes: Not a profile -- loaded inside tpu-fp16r-gpu-head-fp16acc32 and used when its TPU stage can't load or fails (DONE backend code 2).

  yoloe-v8s-pf/gpu-fp16:
    status: rejected
    stages:
      - {name: model, artifact: tflite_gpu_full, accelerator: gpu, precision: fp16, runtime: litert-2.3.0}
    rejected_because: loses 5 of 132 detections
    validation:
      reference: Ultralytics 8.4.184 yoloe-v8s-seg-pf (PyTorch)
      metrics: {detections_retained: "127/132", box_iou_min: 0.942}
      verdict: degraded
      record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop

  yoloe-v8s-pf/tpu-int8:
    status: rejected
    stages:
      - {name: backbone+neck, artifact: tflite_tpu_backbone, accelerator: tpu, precision: int8, runtime: tflite-2.16.1-nnapi}
    rejected_because: "fast (8.7 ms, fully on the TPU) but int8 loses about a third of exact-label detections; not within a few detections of fp32"
    validation:
      reference: Ultralytics 8.4.184 yoloe-v8s-seg-pf (PyTorch)
      metrics: {exact_label_detections: "101/132 (percentile calibration)", any_label: "119/132"}
      verdict: degraded
      record: experiments/pixel6/results.md#2026-10-24--yoloe-v8s-int8-accuracy-diagnosis-tpu-investigation-step-2
    notes: The int8 artifact itself isn't kept in the catalog (rejected); toolchain in spikes/yoloe-tpu.

  # ---- YOLOE-11s prompt-free (non-preferred alternative) -------------------
  yoloe-11s-pf/gpu-fp32:
    status: production
    stages:
      - {name: model, artifact: tflite_gpu_full, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
    validation:
      reference: Ultralytics 8.4.184 yoloe-11s-seg-pf (PyTorch)
      inputs: lane photos (8), 112 reference detections
      metrics: {detections_retained: "112/112", box_iou_min: 1.0, mask_iou_min: 1.0}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop
    benchmarks:
      - {measure: device, ms: 179, statistic: median, covers: "whole model, litert_e2e", record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop}
      - {measure: worker, ms: 178, statistic: median, covers: "worker inference", record: experiments/pixel6/results.md#2026-10-25--registry-serving-eight-gpu-models-staged-beside-production}
      - {measure: round-trip, ms: 561, statistic: median, covers: "photo in through the test MLServer, warm", record: experiments/pixel6/results.md#2026-10-25--registry-serving-eight-gpu-models-staged-beside-production}
    resources: {ram_mb: 619, startup_ms: 2316, notes: "peak RSS; free-memory drop 414 MB"}
    serving:
      slot: gpu-yoloe11s
      profile: yoloe-11s-pf-default
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/yoloe-11s-pf-default.conf
      mlserver_model: yoloe-11s-pf
  yoloe-11s-pf/gpu-fp16acc32:
    status: rejected
    stages:
      - {name: model, artifact: tflite_gpu_full, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0}
    rejected_because: loses one of 112 detections
    validation:
      reference: Ultralytics 8.4.184 yoloe-11s-seg-pf (PyTorch)
      metrics: {detections_retained: "111/112", mask_iou_min: 0.916}
      verdict: degraded
      record: experiments/pixel6/results.md#2026-10-24--yoloe-prompt-free-on-the-gpu-int8-backbone-partition-desktop

  # ---- EdgeSAM-3x ------------------------------------------------------------
  edgesam-3x/tpu-fp16r-gpu-neck-fp32:
    status: production
    stages:
      - {name: trunk, artifact: tflite_tpu_trunk, accelerator: tpu, precision: fp16-relaxed, runtime: tflite-2.16.1-nnapi, phase: image}
      - {name: neck, artifact: tflite_gpu_neck, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
      - {name: box decoder, artifact: tflite_gpu_box_decoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
    internal_fallback: edgesam-3x/gpu-fp32
    preparation:
      - "gelu: tanh approximation as one dependency chain (approximate functional rewrite; TPU compiler op-order workaround)"
      - "bicubic upsample as an exact construction (pad, phase convolutions, depth-to-space)"
      - "neck on the GPU at fp32 (the TPU rejects channel-axis LayerNorm)"
      - "decoder constants fed as inputs (G1 GPU baked-constant defect)"
    validation:
      reference: EdgeSAM-3x original (bicubic, PyTorch)
      inputs: lane photos (8), 132 YOLOE boxes as prompts; LVIS selection set (126 objects) against ground truth
      metrics: {mask_iou_min: 0.944, mask_iou_mean: 0.9983, lvis_mean_iou: 0.871}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-24--edgesam-box-decoder-on-the-gpu-complete-pipelines-quality-vs-sam-21-ground-truth
    benchmarks:
      - {measure: device, ms: 146, statistic: median, covers: "encoder: TPU stage 130 + GPU neck 16", record: experiments/pixel6/results.md#2026-10-24--edgesam-3x-image-encoder-on-the-edge-tpu-rev-e0564124}
      - {measure: worker, ms: 194, statistic: p50, covers: "image + 1 box (a further box on a cached image 52-54 ms)", record: experiments/pixel6/results.md#2026-10-24--cerebrate-hetero-as-the-common-serving-worker-edgesam--yoloe}
      - {measure: round-trip, ms: 438, statistic: p50, covers: "photo + 1 box in, JSON masks out, production gRPC (cached box 121 ms)", record: experiments/pixel6/results.md#2026-10-25--deployed-image-transport-both-steps-and-edgesam}
    resources: {ram_mb: 593, startup_ms: 2200, thermal: "TPU <= 47 C, GPU <= 48 C over a 3-minute sustained run", notes: "45 s cold compile on an empty NNAPI cache"}
    serving:
      slot: hetero2
      profile: edgesam3x-fast
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/edgesam3x-fast.conf
      mlserver_model: edgesam3x-box
      runtime_files: [libtensorflowlite_jni.so]

  edgesam-3x/gpu-fp32:
    status: production
    stages:
      - {name: encoder, artifact: tflite_gpu_encoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
      - {name: box decoder, artifact: tflite_gpu_box_decoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
    preparation:
      - "gelu: erf polynomial (near-exact; 3 px over 132 masks)"
      - "bicubic upsample as an exact construction"
      - "decoder constants fed as inputs"
    validation:
      reference: EdgeSAM-3x original (bicubic, PyTorch)
      inputs: lane photos (8), 132 YOLOE boxes; LVIS selection set
      metrics: {mask_iou_min: 1.0, flipped_pixels: 1, lvis_mean_iou: 0.871}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-24--edgesam-box-decoder-on-the-gpu-complete-pipelines-quality-vs-sam-21-ground-truth
    benchmarks:
      - {measure: device, ms: 267, statistic: median, covers: "encoder", record: experiments/pixel6/results.md#2026-10-24--edgesam-3x-image-encoder-on-the-edge-tpu-rev-e0564124}
      - {measure: worker, ms: 313, statistic: p50, covers: "image + 1 box (a box on a cached image 57 ms)", record: experiments/pixel6/results.md#2026-10-24--cerebrate-hetero-as-the-common-serving-worker-edgesam--yoloe}
    resources: {ram_mb: null}
    serving:
      slot: hetero2
      profile: edgesam3x-default
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/edgesam3x-default.conf

  edgesam-3x/gpu-encoder-fp16acc32-decoder-fp32:
    previous_ids: [gpu-mixed]
    status: validated
    stages:
      - {name: encoder, artifact: tflite_gpu_encoder, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: image}
      - {name: box decoder, artifact: tflite_gpu_box_decoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
    validation:
      reference: EdgeSAM-3x original (bicubic, PyTorch)
      metrics: {mask_iou_min: 0.920, mask_iou_mean: 0.99834}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-24--edgesam-3x-image-encoder-on-the-edge-tpu-rev-e0564124
    benchmarks:
      - {measure: device, ms: 169, statistic: median, covers: "encoder only", record: experiments/pixel6/results.md#2026-10-24--edgesam-3x-image-encoder-on-the-edge-tpu-rev-e0564124}

  # ---- SAM 2.1 Hiera-Tiny ----------------------------------------------------
  sam2.1-hiera-tiny/gpu-fp32:
    status: staged
    stages:
      - {name: encoder, artifact: tflite_gpu_encoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
      - {name: prompt encoder, accelerator: host, precision: n/a, runtime: numpy, phase: prompt, notes: "box -> sparse embedding [1,3,256] (two corner tokens + padding)"}
      - {name: box decoder, artifact: tflite_gpu_box_decoder, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
    preparation:
      - "encoder: <=4-D windowing, q/k/v split, baked position embedding, unused neck encodings dropped, no-memory embedding folded (all exact)"
      - "decoder: GPU-clean re-authoring, 3-token box prompt, constants fed as inputs (exact)"
    validation:
      reference: transformers Sam2Model (facebook/sam2.1-hiera-tiny), unmodified
      inputs: 4 photos x 2 boxes
      metrics: {mask_iou_min: 1.0, flipped_pixels: 0, lvis_mean_iou: 0.883}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny
    benchmarks:
      - {measure: device, ms: 1380, statistic: median, covers: "encoder", record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny}
      - {measure: device, ms: 80, statistic: median, covers: "box decoder, rewriting 24 MB of inputs per run", record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny}
      - {measure: summed, ms: 1460, covers: "encoder + one box"}
      - {measure: worker, ms: 1438, statistic: median, covers: "worker: encoder; + 60 ms per box (persistent buffers)", record: experiments/pixel6/results.md#2026-10-25--registry-serving-eight-gpu-models-staged-beside-production}
      - {measure: round-trip, ms: 1863, statistic: median, covers: "photo + 2 boxes through the test MLServer, warm", record: experiments/pixel6/results.md#2026-10-25--registry-serving-eight-gpu-models-staged-beside-production}
    resources: {ram_mb: 1225, startup_ms: 4731, notes: "peak RSS; free-memory drop 919 MB"}
    serving:
      slot: gpu-sam2
      profile: sam2.1-hiera-tiny-default
      worker_config: hosts/cerebrate-pixel6/cerebrate-hetero/configs/sam2.1-hiera-tiny-default.conf
      mlserver_model: sam2.1-hiera-tiny
  sam2.1-hiera-tiny/gpu-fp16acc32:
    previous_ids: [gpu-mixed]
    status: validated
    stages:
      - {name: encoder, artifact: tflite_gpu_encoder, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: image}
      - {name: prompt encoder, accelerator: host, precision: n/a, runtime: numpy, phase: prompt}
      - {name: box decoder, artifact: tflite_gpu_box_decoder, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: prompt}
    validation:
      reference: transformers Sam2Model (facebook/sam2.1-hiera-tiny), unmodified
      inputs: 4 photos x 2 boxes, each half judged with the other at fp32
      metrics: {encoder_mask_iou_min: 0.981, decoder_mask_iou_min: 0.978, together_mask_iou_min: 0.963, together_flipped_pixels: 492}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny
    benchmarks:
      - {measure: device, ms: 770, statistic: median, covers: "encoder", record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny}
      - {measure: device, ms: 57, statistic: median, covers: "box decoder", record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny}
      - {measure: summed, ms: 827, covers: "encoder + one box"}
      - {measure: worker, ms: 815, statistic: median, covers: "worker: encoder; + 38 ms per box", record: experiments/pixel6/results.md#2026-10-25--registry-serving-eight-gpu-models-staged-beside-production}
    limitations: ["the halves were validated separately (worst 0.981 / 0.978); measured together through the serving path (2026-10-25): worst mask IoU 0.963, 492 px -- below either half alone"]
    serving_blocked: "unresolved: worst mask IoU 0.963 end to end, below either half alone; not promoted, the exact FP32 configuration serves box-refinement quality (decision 2026-10-25)"
    resources: {ram_mb: 845, startup_ms: null, notes: "peak RSS; free-memory drop 568 MB"}
  sam2.1-hiera-tiny/gpu-fp16:
    status: rejected
    stages:
      - {name: encoder, artifact: tflite_gpu_encoder, accelerator: gpu, precision: fp16, runtime: litert-2.3.0}
    rejected_because: precision failure on both encoder (worst mask IoU 0.833) and decoder (0.559)
    validation:
      reference: transformers Sam2Model
      metrics: {encoder_mask_iou_min: 0.833, decoder_mask_iou_min: 0.559}
      verdict: failed
      record: experiments/pixel6/results.md#2026-10-24--sam-21-hiera-tiny

  # ---- EfficientSAM3 RV-M ----------------------------------------------------
  efficientsam3-rvm/gpu-fp32:
    status: validated
    stages:
      - {name: vision, artifact: tflite_gpu_vision, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
      - {name: text, artifact: tflite_cpu_text, accelerator: cpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
      - {name: grounding, artifact: tflite_gpu_grounding, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
    preparation:
      - "grounding: six exact rewrites (constants as inputs, precomputed sine frequencies, float padding mask, 4-D box bias, inverse_sigmoid without clamp, last-layer scoring)"
    validation:
      reference: EfficientSAM3 RV-M original (Sam3Processor, PyTorch)
      inputs: 11 (photo, prompt) samples, 20 reference detections
      metrics: {detections_retained: "20/20", final_mask_iou_min: 1.0, flipped_pixels: 1}
      verdict: exact
      record: experiments/pixel6/results.md#2026-10-24--efficientsam3-rv-m-phone-native-chain-variants-reproductions-caching
    benchmarks:
      - {measure: device, ms: 728, statistic: median, covers: "vision, whole graph", record: experiments/pixel6/results.md#2026-10-25--efficientsam3-rv-m-split-precision-vision-as-a-connected-pipeline-registered-fast}
      - {measure: device, ms: 3280, statistic: median, covers: "grounding per prompt", record: experiments/pixel6/results.md#2026-10-24--efficientsam3-rv-m-our-conversion-checkpoint-rev-85b05896}
      - {measure: summed, ms: 4025, covers: "first prompt on a new image: vision + text 17 ms + grounding"}
    limitations: ["not stageable on the Pixel 6: loading the FP32 vision + FP32 grounding worker took the phone from 3.3 GB to 850 MB free (2026-10-25); the fast variant needs 2.4 GB"]
    serving_blocked: "memory: loading it took the Pixel 6 from 3.3 GB to 850 MB free; kept as the validated reference, the fast variant is served instead (decision 2026-10-25)"
    resources: {ram_mb: null, notes: "load peak > 2.5 GB (free-memory drop); stopped by the test guard before requests"}

  efficientsam3-rvm/gpu-trunk-fp32-neck-fp16acc32-grounding-fp16acc32:
    status: staged
    stages:
      - {name: vision trunk, artifact: tflite_gpu_vision_trunk, accelerator: gpu, precision: fp32, runtime: litert-2.3.0, phase: image}
      - {name: vision neck, artifact: tflite_gpu_vision_neck, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: image, notes: "trunk output buffer passed straight to the neck"}
      - {name: text, artifact: tflite_cpu_text, accelerator: cpu, precision: fp32, runtime: litert-2.3.0, phase: prompt}
      - {name: grounding, artifact: tflite_gpu_grounding, accelerator: gpu, precision: fp16acc32, runtime: litert-2.3.0, phase: prompt}
    validation:
      reference: EfficientSAM3 RV-M original (Sam3Processor, PyTorch)
      inputs: 11 (photo, prompt) samples, 20 reference detections (scores down to 0.504 and 0.510)
      metrics: {detections_retained: "20/20", final_mask_iou_min: 0.9987, flipped_pixels: 687}
      verdict: near-identical
      record: experiments/pixel6/results.md#2026-10-25--efficientsam3-rv-m-split-precision-vision-as-a-connected-pipeline-registered-fast
