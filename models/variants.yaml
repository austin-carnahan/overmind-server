# Closed or deferred investigations: don't repeat without the revisit condition.
investigations:
  - topic: MI-GAN generator on the Edge TPU (fp16-relaxed)
    models: [mi-gan-512]
    date: "2026-10-25"
    status: closed
    outcome: "first encoder block accurate but slower than the GPU (34 vs 23.5 ms at FP16); the 168-op encoder's compile passed 3 GB and hit the driver deadline (the memory guard can't stop the compiler)"
    record: experiments/pixel6/results.md#2026-10-25--mi-gan-generator-on-the-edge-tpu-fp16-relaxed-stopped
  - topic: EfficientSAM3 RV-M vision encoder on the Edge TPU
    models: [efficientsam3-rvm]
    date: "2026-10-25"
    status: closed
    outcome: "RepViT's SE MEAN over 252x252 doesn't compile at the 1008 input; at 1024 stage 1 compiles (775 MB) but runs at half the GPU's speed; the neck is no faster than GPU FP16+FP32-acc, which already passes. GPU split precision adopted instead"
    record: experiments/pixel6/results.md#2026-10-25--efficientsam3-rv-m-vision-on-the-edge-tpu-fp16-relaxed-no-go-gpu-split-precision-instead
  - topic: EfficientSAM3 per-image cache of the first fusion layer's self-attention
    models: [efficientsam3-rvm]
    date: "2026-10-25"
    status: deferred
    outcome: "prompt-independent (verified bit-identical across prompts); would save ~190 ms per additional prompt with fast grounding (364 ms default). Not implemented"
    revisit_if: repeated text prompts on an already encoded image become a measured bottleneck
    record: experiments/pixel6/results.md#2026-10-24--efficientsam3-rv-m-phone-native-chain-variants-reproductions-caching
  - topic: YOLOE int8 on the Edge TPU
    models: [yoloe-v8s-pf, yoloe-11s-pf]
    date: "2026-10-24"
    status: closed
