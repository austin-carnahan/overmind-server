  efficientsam3-rvm:
    description: >-
      EfficientSAM3 RV-M (fine-tuned full model): SAM 3's text-prompted
      concept segmentation -- every instance of a phrase, with masks -- with
      a RepViT-M1.1 image encoder and a MobileCLIP-S0 text encoder. Our
      LiteRT conversions (spikes efficientsam3-gpu, efficientsam3-tpu):
      vision on the GPU once per image, text on the CPU (17 ms per phrase,
      cacheable), grounding on the GPU per prompt (early fusion: not
      cacheable). Validated on the 11-sample phone-native chain (20
      detections, against the original model). Edge TPU ruled out for the
      vision encoder (2026-10-25). Apache-2.0.
    capabilities:
      - segment-by-text
    # Every artifact derives from the one checkpoint
    # (efficientsam3_ft/efficientsam3_repvit.pt).
    artifacts:
      tflite_gpu_vision:
        # unprepared, 340 ops
        source: {repo: Simon7108528/EfficientSAM3, revision: 85b05896928f974e308f889d7ccb2eefc069de98}
        derived: true
        produced_by: hosts/cerebrate-pixel6/spikes/efficientsam3-gpu/esam3_convert.py
