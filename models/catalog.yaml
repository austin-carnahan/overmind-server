          - {name: esam3-rvm-vision-fp32.tflite, sha256: 775baa8b0ebdd671f3c3c9d77c0832ef5d72d55bf22d2e90d9768d7d14773d45, bytes: 99154672, origin: esam3/esam3-rvm-vision-fp32.tflite}
        validated:
          pixel6_litert_compiled_gpu: passed
          # reduced precision over the whole graph drops a borderline detection
          pixel6_litert_compiled_gpu_fp16acc32: failed
      tflite_gpu_vision_trunk:
        # RepViT + head + resize -> 72x72x1024
        source: {repo: Simon7108528/EfficientSAM3, revision: 85b05896928f974e308f889d7ccb2eefc069de98}
        derived: true
