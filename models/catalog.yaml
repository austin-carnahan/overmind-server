  edgesam-3x:
    previous_ids: [edgesam3x]
    description: >-
      EdgeSAM-3x promptable segmentation (box prompt -> mask), our conversions
      of the original (bicubic) model. Segmentation and Labeling Lane, Step 4:
      the task default for box refinement. Served by cerebrate-hetero through
      the supervisor's hetero2 slot as MLServer model edgesam3x-box: a request
