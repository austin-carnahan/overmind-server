          - {name: mmproj-model-f16.gguf, sha256: 4b7b2c4ed3162bd9cb323668c188e2324838b8f8ca4f3f9767f16c4c600d43ad, bytes: 190031712}
    worker:
      binary: cerebrate-gguf
      port: 8768
    serving:
      mlserver_model: cerebrate-gguf
      interface: image-prompt-text-v1
    aliases:
      default: cpu-bf16
      reference: cpu-bf16
    requirements:
      disk_mb: 497.5
      ram_mb: null

  yoloe-v8s-pf:
    description: >-
      YOLOE-v8s prompt-free instance segmentation (Ultralytics 8.4.184
      yoloe-v8s-seg-pf): boxes, masks and one of 4,585 built-in labels per
      object, no prompt. Segmentation and Labeling Lane, Step 2B. Served by
      cerebrate-hetero through the supervisor's hetero1 slot as MLServer
      model yoloe-v8s-pf (live since 2026-10-25, on demand); takes the encoded
      photo and returns JSON detections in photo coordinates.
    # Capability names beyond catalog v4's initial list, introduced by the
    # lane for prompt-free detection and masks.
    capabilities:
      - detect-objects
      - segment-objects
    # All three are our own conversions of the one upstream checkpoint (no
    # published LiteRT/TPU conversion exists): source = the checkpoint,
    # verified by hash against the release asset; files = what is deployed.
    # Produced by hosts/cerebrate-pixel6/spikes/yoloe-tpu. Accuracy is
    # task-level against the original model on the lane's eight photos (132
    # detections), not tensor similarity.
    artifacts:
      tflite_tpu_backbone:
        # Backbone + neck, max-pool padding corrected; Edge TPU via NNAPI with
        # fp16 relaxation.
        source:
          url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yoloe-v8s-seg-pf.pt
          sha256: df213f389d69a0df544cc1a3e500f567176468e4b4ed2ce933b8073c27539ac1
        derived: true
        produced_by: hosts/cerebrate-pixel6/spikes/yoloe-tpu/yoloe_fp16_tpu_prep.py
        files:
          - {name: yoloe-v8s-pf-backbone-tpu-fp32.tflite, sha256: f4bfb17807c6f11e60001283e237a96de068a01dc6c668f24134ae14e43a8be1, bytes: 36082040}
        validated:
          pixel6_tflite_nnapi_tpu_fp16relaxed: passed
      tflite_gpu_head:
        # Head with native int32 argmax; LiteRT 2.3 GPU.
        source:
          url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yoloe-v8s-seg-pf.pt
          sha256: df213f389d69a0df544cc1a3e500f567176468e4b4ed2ce933b8073c27539ac1
        derived: true
        produced_by: hosts/cerebrate-pixel6/spikes/yoloe-tpu/yoloe_head_gpu.py
        files:
          - {name: yoloe-v8s-pf-head-gpu.tflite, sha256: 4001f7e83c55c6c02dc7ab0cb62bfdfe819a36b9945e4604b6bc2c2025943c54, bytes: 18324116}
        validated:
          pixel6_litert_compiled_gpu_fp16acc32: passed
      tflite_gpu_full:
        # The whole model on the GPU, NHWC input: the default variant (fp32)
        # and the fast variant's internal fallback (fp16 + fp32 accumulation).
        source:
          url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yoloe-v8s-seg-pf.pt
          sha256: df213f389d69a0df544cc1a3e500f567176468e4b4ed2ce933b8073c27539ac1
        derived: true
        produced_by: hosts/cerebrate-pixel6/spikes/yoloe-tpu/yoloe_convert_gpu.py
        files:
          - {name: yoloe-v8s-pf-gpu-nhwc.tflite, sha256: dc504b3bf8467a8f39e7fac752ec99698891b152aa0d2e91d60f068e89f018ac, bytes: 54455484}
        validated:
          pixel6_litert_compiled_gpu: passed
          pixel6_litert_compiled_gpu_fp16acc32: passed
          pixel6_litert_compiled_gpu_fp16: failed
    worker:
      binary: cerebrate-hetero
      port: 8772
    aliases:
      default: gpu-fp32
      reference: gpu-fp32
      fast: tpu-fp16r-gpu-head-fp16acc32
    serving:
      mlserver_model: yoloe-v8s-pf
      interface: photo-detections-v1
    execution_preferences:
      pixel6:
        - tpu_gpu_hybrid
        - litert_gpu_fp16acc32
        - litert_gpu_fp32
    requirements:
      # The three .tflite files, MiB (the default variant alone: 51.93).
      disk_mb: 103.82
      # Worker RSS, fast profile with its fallback loaded; flat over a
      # 3-minute sustained run. The default profile's is not measured.
      ram_mb: 713

  yoloe-11s-pf:
    description: >-
      YOLOE-11s prompt-free instance segmentation (Ultralytics 8.4.184
