      returns JSON masks in photo coordinates; the worker caches each image's
      embedding (4 images, LRU). Live from 2026-10-25. Licence: S-Lab License
      1.0, non-commercial use only.
    capabilities:
      - refine-box-mask
    # Our own conversions of the one checkpoint (no published LiteRT/TPU
    # conversion; the authors' ONNX swaps the trained bicubic upsample for
    # bilinear). Produced by hosts/cerebrate-pixel6/spikes/edgesam-tpu.
