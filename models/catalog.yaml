      encoder + the constants-as-inputs box decoder (spike sam21-gpu), exact
      at fp32 on the Pixel 6 GPU. The box prompt's sparse embedding is
      computed on the host (SAM 2.1's prompt encoder: two box corners).
    capabilities:
      - refine-box-mask
    artifacts:
      tflite_gpu_encoder:
        # prepared: <=4-D windowing, q/k/v split, baked position embedding,
