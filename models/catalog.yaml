        source: {repo: chongzhou/EdgeSAM, revision: e0564124628944e1622973d4e0f68158b46f035a}
        derived: true
        produced_by: hosts/cerebrate-pixel6/spikes/edgesam-tpu/edgesam_decoder.py
        files:
          - {name: edgesam3x-box-decoder.tflite, sha256: 3ca8392162d1dc4555be0a4ac1af25227e8f823149ac79f364234423b33ad294, bytes: 14951076}
          - {name: edgesam3x-dec-dense.bin, sha256: 9f2f518ac1eec7eaf2652a039568daf2e98c094f8c3eeabf1f5bc4a3fd343e41, bytes: 4194304}
          - {name: edgesam3x-dec-image_pe.bin, sha256: 723ab5bfa0e6204cecc0a4c1fa7d7cb28bc2f6aba8a8012220efd0299b2db2d9, bytes: 4194304}
          - {name: edgesam3x-dec-output_tokens.bin, sha256: 908a98672257671c27e575bdb7d145f9fe4d3c6f81f7e7a640aae0c2a09ce73c, bytes: 5120}
