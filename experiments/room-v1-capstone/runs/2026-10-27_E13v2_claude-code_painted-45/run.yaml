  in_gimp: "every element a layer: painted bases (gimp_draw fill + gegl:noise-rgb), photo textures warped with gimp-item-transform-matrix, door painted with gimp_draw in its own image and warped with gimp-item-transform-perspective, gradients with gimp-drawable-edit-gradient-fill, blurs/shadows with gimp_apply_filter"
  tricks:
    - "right wall (never photographed): painted in the colour of the strip the photo does show (#655238, warmer: it faces the windows) + a Multiply gradient darkening toward the corner + grain"
    - "door: position from the casing's floor contact (Y 1.33 from the right wall's floor line), standard proportions from the ceiling height; painted front-on (casing in the window trim's colour, slab in the photo door's colour, two panel outlines, brass knob) and warped onto the wall"
    - "baseboards on the right wall: the back wall's baseboard texture warped along it, either side of the door"
    - "ceiling: painted in the photo's lit ceiling colour + radial falloff; the warped photo ceiling (a smeared streak) hidden"
    - "floor and near left wall: shifted copies of their own texture from further along the same plane (rug, vents, window masked out), feathered 80 px"
    - "bed: foot face and top warped from the photo with the pillows cut out of the top; pillows, lamp, stool as upright sprites; soft contact shadows"
    - "framing: a 4:3 crop that keeps the convincing part"

