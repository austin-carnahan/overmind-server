    Re-derived. v1/v2 took the vanishing points from the baseboards' top and bottom edges, ~90 px apart, so they
    were badly off (f 2393, the ceiling at 1.16-1.49 camera heights depending on where it was measured). v3 takes
    each wall's VP from its floor line and ceiling line (back (2,1180), left (3327,1192)): f 1598, tilt ~11 deg;
    the ceiling comes out at 1.685-1.703 everywhere on both walls, and the predicted vertical VP (1971,9661) matches
    the one measured from the door casing and window trim (~1910,10285).
  view: "turned 45 deg (yaw -45) about the room, standing inside it at (1.5, 0.0) against the near wall; v2's orbit had put the camera 0.8 units outside the room"
  planes: "each room rectangle clipped in 3D to the new view and then to the photo's view: its source polygon and its target share the model's edges, so walls, ceiling and floor meet by construction"
  doorway: "the photo's grazing strip of the right wall, warped, holds the real closet doorway (casing, open slab, strap hinges, knob) near the back corner; kept inside the door quad, wall painted around it, a crisp casing painted front-on (trim colour) and warped over the opening edges"
  fan: "SAM 2.1 (box) candidate 1 + two chain polygons; MI-GAN removed it from the ceiling texture (its ceiling shadow kept); re-placed as one upright sprite anchored at its canopy, scaled by distance"
  furniture: "v2's hand-fitted boxes carried over through their image corners into the new camera; faces warped, except faces nearly edge-on to the new camera (cos < 0.3), which are painted; pillows as sprites, nudged 40 px onto the bed"
  texture_cleanup: "nightstand ghost: wall part MI-GAN, floor part shifted along the floor plane, baseboard band mapped band-to-band from measured edges (the lens bends them)"
  framing: "4:3 crop that drops the unphotographed right-edge strip"

