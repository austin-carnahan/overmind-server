# Copy to runs/<YYYY-MM-DD>_<EXX>_<agent>_<slug>/run.yaml. One folder per attempt; never overwrite a run.
experiment: E01
run_id: 2026-10-27_E01_claude-code_wall-sage
condition: exploratory            # exploratory | baseline | revised-skill  (README, "Comparison protocol")
status: not_started               # not_started | running | pass | partial | fail | blocked
started: null
finished: null

agent:
  name: Claude Code               # or Buckminster
  harness: "Claude Code VS Code extension 2.1.308"
  model: claude-opus-5-5
skills:                           # git commit of .claude/skills when the run started (or the frozen tag)
  revision: null
  loaded: [gimp, interior-scene-editing]
capabilities:                     # what was reachable, not what was used
  gimp_agent_mcp: "0.5.0 (38 tools, Python off)"
  gimp: "3.2.6"
  overmind_gimp_plugin: null      # git commit of gimp-plugins/overmind-import-artifact
  cerebrate_mcp: null             # source commit + image digest; list_capabilities at run start if it matters
  extra: []                       # e.g. "Python + bridge client on the Mac", "shell on Overmind"

inputs:
  scene: bedroom_v1               # assets/manifest.yaml scenes; record the sha256 if it differs
  assets: []                      # asset ids from assets/manifest.yaml
  instruction: ""                 # the user's instruction, verbatim

outputs:                          # under ~/DesignStudio/workspaces/room-v1-capstone/runs/<run_id>/
  xcf: working.xcf
  clean: after-clean.png
  annotated: after-annotated.png
  before: before.png

attempts:                         # up to five approaches; a scope change from the user resets the count
  - n: 1
    method: null
    result: null                  # and why the next attempt was needed
model_comparison: {}              # when more than one model was tried on the same input: model -> what it gave; chosen
coverage_check: null              # how masks/regions were checked complete (e.g. an overlay render) before judging results

# What the agent achieved, and separately what that required.
interfaces:                       # everything used, with what for
  mcp_tools: []                   # e.g. "gimp_pdb_call (overmind-place-on-floor)", "cerebrate segment_region (SAM 2.1, candidates)"
  models: []                      # actual variants
  scripts_or_direct: []           # anything outside the MCP tools (scripts, bridge client, local image processing)
beyond_buckminster:               # one entry per step that needed a capability Buckminster lacks
  - step: null
    capability: null
    why: null                     # why it was preferable to the MCP route
    mcp_alternative: null         # could existing MCP operations or a small reusable primitive do it?
    tradeoffs: null               # reliability, safety, performance observed
interventions: []                 # human help: what, when, why
observations:                     # at most three
  worked: null
  failed: null
  follow_up: null
skill_updates: []                 # commits that changed a skill because of this run
