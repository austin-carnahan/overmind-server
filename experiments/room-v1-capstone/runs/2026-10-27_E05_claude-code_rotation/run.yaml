  C2D_face_swap: "swap front and side faces into each other's slots, widths by an assumed W/D ratio (cabinet only)"
  C3D_camera: "camera from two perpendicular vanishing points; object fitted as a box on the floor; rotated 90 deg (and moved) in 3D; each visible face warped from its source face (hidden faces from their opposite, mirrored) by a homography; top rotated; small objects on top (pillows, lamp) re-anchored as sprites; new footprint shadow"
  D_identity: "four-fold or rotationally symmetric objects: a quarter turn looks the same -- leave them"

results:
  bed:
    C3D_plus90: "convincing: striped long side to the front, mirrored foot end as the head end, blanket top rotated, pillows as sprites at the head end. Untidy near corner (blanket overhang vs end face)."
    C3D_minus90: "geometrically right; pillows not carried (flattened into the top)."
    A_mirror: "plausible at a glance, but the mirrored bed contradicts the room's perspective (it is the same view flipped, not a turn)."
  nightstand: "C3D: rotated -90 and moved against the left wall, drawers facing into the room, lamp riding along: convincing; small stretched patch between the legs."
