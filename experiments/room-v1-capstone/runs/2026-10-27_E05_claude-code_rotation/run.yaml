beyond_buckminster:
  - step: "camera from vanishing points, box fitting, 3D rotation, homographies"
    capability: "numerical computation (NumPy: SVD for homographies, ray casting)"
    why: "every face needs a 3x3 projective matrix from 4 point pairs; by hand this is error-prone"
    mcp_alternative: "a small primitive: warp a layer from a source quad to a target quad (the plug-in computes the homography); the 3D part (where the rotated corners land) would still need geometry -- a 'rotate box on floor' helper using the stored floor horizon/vanishing points would cover it"
    tradeoffs: "without it, an agent can only do A (mirror) and D (identity), or eyeball target quads"
