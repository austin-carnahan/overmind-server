name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate documentation, examples, and shell scripts
        run: ./scripts/check-repo --require-shellcheck
